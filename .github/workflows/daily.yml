# 每日播报 · GitHub Actions 工作流。
# 配好下面这些 Secrets 并 push 到自己仓库，GitHub 就会【每天免费替你跑】，关机也照跑：
#
#   调度器（这个 schedule = GitHub 的闹钟）→ 执行（cron_entry.py）→ 数据源抓取 / LLM 调用 / 投递
#
# 免费额度：public 仓库无限分钟；private 仓库 GitHub Free 每月 2000 分钟。播报一天 1–3 分钟，绰绰有余。
#
# ⚠️ 密钥放仓库 Settings → Secrets and variables → Actions，绝不写进这个 YAML。

name: daily-broadcast

on:
  schedule:
    - cron: "17 1 * * *"        # UTC 01:17 = 北京 09:17；避开整点（整点高峰会被延迟甚至丢任务）
  workflow_dispatch: {}          # 也能在 Actions 页点「Run workflow」立刻手动测一次

permissions:
  contents: write                # 让它能把更新后的 digest.md 提交回仓库（见最后一步）
  pages: write                    # 让它能把 web/ 发布到 GitHub Pages
  id-token: write                # deploy-pages 官方 action 要求

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  broadcast:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: run broadcast
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          # 渠道 A：Gmail
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          # 渠道 B（在大陆推荐）：把 config.yaml 设 channel: feishu，并改用这个 secret：
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: python cron_entry.py
      - name: render web/index.html
        run: python web/render.py
      - name: persist digest + web（既存「记忆」，又顺手让定时别被 60 天闲置停掉）
        run: |
          git config user.name "broadcast-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digest.md web/index.html 2>/dev/null || true
          git commit -m "digest $(date -u +%F)" 2>/dev/null && git push || echo "no change to commit"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
